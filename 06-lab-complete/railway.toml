# Railway: build bằng Dockerfile, Railway cấp biến PORT (CMD trong Dockerfile đọc ${PORT}).
# Secret (AGENT_API_KEY) và REDIS_URL đặt trong tab Variables của service, không ghi ở đây.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
